name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # rustup reads rust-toolchain.toml, so CI uses the pinned toolchain.
      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # All checks live in xtask; CI adds none of its own.
      - name: cargo xtask ci
        run: cargo xtask ci

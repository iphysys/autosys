# cargo-deny configuration (blueprint §13.1). Run through `cargo xtask ci`.

[graph]
all-features = true

[advisories]
# Vulnerable and unmaintained crates fail the check; ignores need a justification here.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Licenses compatible with distributing this MIT-licensed project.
allow = [
    "MIT",
    # MIT without the attribution clause (borrow-or-share, via jsonschema).
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allow-list is set ahead of the dependencies that later PRs add.
unused-allowed-license = "allow"
# Mozilla's root certificates as data, a permissive data licence. reqwest's
# rustls features always bring it in through rustls-platform-verifier
# (ADR-0027); allowed for this crate only.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

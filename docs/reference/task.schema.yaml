$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.org/schemas/task.schema.yaml"
title: Task specification
description: >-
  Canonical contract for creating and validating task instances. The semantic
  section states the work to be accomplished and its completion criteria. The
  contract section defines typed inputs and outputs. The execution section
  identifies ownership, dependencies, limits, and lifecycle state.
type: object
additionalProperties: false
required:
  - task

properties:
  task:
    type: object
    additionalProperties: false
    required:
      - semantic
      - contract
      - execution
    properties:
      semantic:
        $ref: "#/$defs/semanticDefinition"
      contract:
        $ref: "#/$defs/taskContract"
      execution:
        $ref: "#/$defs/executionDefinition"
      result:
        $ref: "#/$defs/resultDefinition"
      metadata:
        $ref: "#/$defs/metadata"

$defs:
  nonEmptyString:
    type: string
    minLength: 1

  stringList:
    type: array
    uniqueItems: true
    items:
      $ref: "#/$defs/nonEmptyString"

  semanticDefinition:
    title: Semantic definition
    description: Defines what work is requested and what successful completion means.
    type: object
    additionalProperties: false
    required:
      - name
      - description
      - goal
      - acceptanceCriteria
    properties:
      name:
        allOf:
          - $ref: "#/$defs/nonEmptyString"
        description: Short recognizable name for the task.
      description:
        allOf:
          - $ref: "#/$defs/nonEmptyString"
        description: Clear description of the work to perform.
      goal:
        allOf:
          - $ref: "#/$defs/nonEmptyString"
        description: Outcome the task is expected to achieve.
      acceptanceCriteria:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/nonEmptyString"
        description: Observable conditions that determine successful completion.
      context:
        type: string
        description: Additional task-specific context needed to perform the work.

  taskContract:
    title: Input and output contract
    description: Structured data contract for executing the task.
    type: object
    additionalProperties: false
    properties:
      inputSchema:
        $ref: "#/$defs/jsonSchema"
      outputSchema:
        $ref: "#/$defs/jsonSchema"

  executionDefinition:
    title: Execution definition
    description: Defines assignment, dependencies, execution limits, and lifecycle state.
    type: object
    additionalProperties: false
    required:
      - status
    properties:
      assignedAgent:
        type: string
        minLength: 1
        description: Identifier of the agent responsible for executing the task.
      requiredSkills:
        allOf:
          - $ref: "#/$defs/stringList"
        description: Skills required or requested for this task.
        default: []
      allowedTools:
        allOf:
          - $ref: "#/$defs/stringList"
        description: Tools explicitly available while executing this task.
        default: []
      dependencies:
        allOf:
          - $ref: "#/$defs/stringList"
        description: Task identifiers that must be satisfied before this task.
        default: []
      maxTurns:
        type: integer
        minimum: 1
        description: Optional task-specific agent-loop turn limit.
      status:
        type: string
        enum:
          - submitted
          - working
          - input-required
          - auth-required
          - completed
          - failed
          - canceled
          - rejected
        description: Current task lifecycle state.

  resultDefinition:
    title: Task result
    description: Runtime result information populated as the task executes or terminates.
    type: object
    additionalProperties: false
    properties:
      output:
        description: Task output. Validate against contract.outputSchema when supplied.
      artifacts:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
            - name
            - uri
          properties:
            name:
              $ref: "#/$defs/nonEmptyString"
            uri:
              $ref: "#/$defs/nonEmptyString"
            mediaType:
              type: string
      error:
        type: object
        additionalProperties: false
        required:
          - message
        properties:
          code:
            type: string
          message:
            $ref: "#/$defs/nonEmptyString"

  metadata:
    type: object
    additionalProperties: false
    properties:
      id:
        type: string
        minLength: 1
        description: Stable identifier for this task instance.
      contextId:
        type: string
        minLength: 1
        description: Identifier grouping related tasks or interactions.
      parentTaskId:
        type: string
        minLength: 1
        description: Parent task identifier when this task was delegated or decomposed.
      tags:
        allOf:
          - $ref: "#/$defs/stringList"
        default: []

  jsonSchema:
    description: Embedded JSON Schema describing task input or output.
    oneOf:
      - type: object
      - type: boolean

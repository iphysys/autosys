$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.org/schemas/skill.schema.yaml"
title: Skill specification
description: >-
  Canonical contract for creating and validating reusable agent skills. The
  semantic section describes what the skill teaches and when it should be used.
  The content section identifies the instructions and optional bundled resources.
  The runtime section declares execution requirements and allowed tool access.
type: object
additionalProperties: false
required:
  - skill

properties:
  skill:
    type: object
    additionalProperties: false
    required:
      - semantic
      - content
    properties:
      semantic:
        $ref: "#/$defs/semanticDefinition"
      content:
        $ref: "#/$defs/contentDefinition"
      runtime:
        $ref: "#/$defs/runtimeDefinition"
      metadata:
        $ref: "#/$defs/metadata"

$defs:
  nonEmptyString:
    type: string
    minLength: 1

  pathList:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1

  semanticDefinition:
    title: Semantic definition
    description: Describes what the skill provides and when an agent should activate it.
    type: object
    additionalProperties: false
    required:
      - name
      - description
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description: Stable skill identifier, compatible with Agent Skills naming rules.
      description:
        type: string
        minLength: 1
        maxLength: 1024
        description: What the skill does and when the agent should use it.

  contentDefinition:
    title: Skill content
    description: Instructions and optional resources bundled with the skill.
    type: object
    additionalProperties: false
    required:
      - instructions
    properties:
      instructions:
        type: string
        minLength: 1
        description: Procedural guidance loaded when the skill is activated.
      scripts:
        allOf:
          - $ref: "#/$defs/pathList"
        description: Executable files bundled with the skill.
        default: []
      references:
        allOf:
          - $ref: "#/$defs/pathList"
        description: Reference material that may be loaded on demand.
        default: []
      assets:
        allOf:
          - $ref: "#/$defs/pathList"
        description: Templates, examples, or static resources bundled with the skill.
        default: []

  runtimeDefinition:
    title: Runtime requirements
    type: object
    additionalProperties: false
    properties:
      allowedTools:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/nonEmptyString"
        description: Tools pre-approved for use while executing this skill.
        default: []
      compatibility:
        type: string
        maxLength: 500
        description: Environment or runtime requirements for using the skill.
      isolation:
        type: string
        enum:
          - inherit
          - none
          - worktree
          - container
        default: inherit

  metadata:
    type: object
    additionalProperties: false
    properties:
      version:
        type: string
        pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$"
        default: "1.0.0"
      author:
        type: string
        minLength: 1
      license:
        type: string
        minLength: 1
      tags:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/nonEmptyString"
        default: []

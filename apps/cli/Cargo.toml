[package]
name = "synth-cli"
version = "0.1.0"
description = "The synth CLI: a thin client of API v0 that starts, watches, approves, cancels and reports runs (ADR-0034)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "synth"
path = "src/main.rs"

[dependencies]
synth-api-client.workspace = true

# Allowed in binaries (blueprint section 13.1).
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time"] }
tracing-subscriber.workspace = true

[lints]
workspace = true

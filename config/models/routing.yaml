# Model profiles for the model gateway (blueprint section 14.4, ADR-0027,
# ADR-0028, ADR-0036). Schema: schemas/config/model-routing.schema.json
#
# Choosing a model: each profile pairs a registered provider with one model,
# and the profile name is the choice. This variant of the harness runs on
# the internal Pliny platform only (ADR-0036):
#
#   pliny    the internal Pliny platform, the default
#
# An agent names a profile in its model_profile, or gets default_profile.
# SYNTH_MODEL_PROFILE replaces the default for a run. Another model served
# by Pliny is one more profile here, with its price below if it has one; no
# code changes.
#
# `settings` belong to the profile's provider and follow its schema in
# schemas/config/model-providers/. Keys and deployment endpoints are named by
# environment variable (see .env.example) and never written here. A missing
# variable of a profile in use fails at startup, naming it.
schema_version: "0.2"
default_profile: pliny
profiles:
  # The internal Pliny platform, through its OpenAI-compatible endpoint.
  - name: pliny
    provider: openai_compatible
    model: snps-provider/nemotron-3-ultra-550b-a55
    # Pliny returns tool calls (ADR-0036). The adapter's mapping is tested
    # against hand-written chat-completions responses; a captured round trip
    # follows once Pliny is reachable (docs/plans/pliny-tool-calling.md).
    tool_calling: true
    max_output_tokens: 16000
    request_timeout_seconds: 600
    retry:
      max_attempts: 3
      initial_backoff_ms: 1000
      max_backoff_ms: 30000
    settings:
      base_url_env: PLINY_BASE_URL
      api_key_env: PLINY_API_KEY
      # A PEM bundle trusted in addition to the system roots. TLS
      # verification cannot be turned off.
      ca_bundle_env: INTERNAL_CA_BUNDLE
      headers:
        X-TFY-LOGGING-CONFIG: '{"enabled":true}'

# USD per million tokens. Pliny's model has no price, so its calls report an
# unknown cost, never zero (ADR-0027), and the eval's cost cap does not bind.
prices: []

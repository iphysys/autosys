[workspace]
resolver = "3"
# Crates are added when their component is first built (blueprint §10.1, §24).
members = [
    "crates/contracts",
    "crates/infra",
    "crates/schema-types",
    "crates/sdr",
    "crates/testkit",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
synth-contracts = { path = "crates/contracts" }
synth-schema-types = { path = "crates/schema-types" }
synth-testkit = { path = "crates/testkit" }

anyhow = "1.0"
# Object-safe async traits (ADR-0015).
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
# Network schema resolution stays off: tests resolve references from local files only.
jsonschema = { version = "0.58", default-features = false }
prettyplease = "0.3"
# Property tests; the fork and timeout runners are not needed.
proptest = { version = "1.11", default-features = false, features = ["std"] }
regress = "0.12"
# typify 0.8 reads schemars 0.8 schema types.
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
# PostgreSQL access with compile-time checked queries (ADR-0016). Features are
# chosen per crate; no TLS backend until a shared environment exists.
sqlx = { version = "0.9", default-features = false }
syn = "3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# build.rs uses the library API only; the import_types! macro is not needed.
typify = { version = "0.8", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Allowed in tests through clippy.toml.
unwrap_used = "deny"
expect_used = "deny"

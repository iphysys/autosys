[workspace]
resolver = "3"
# Crates are added when their component is first built (blueprint §10.1, §24).
members = [
    "apps/worker",
    "crates/bootstrap",
    "crates/context",
    "crates/contracts",
    "crates/evaluation",
    "crates/governance",
    "crates/infra",
    "crates/model-gateway",
    "crates/runtime",
    "crates/schema-types",
    "crates/sdr",
    "crates/testkit",
    "crates/tools",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
synth-bootstrap = { path = "crates/bootstrap" }
synth-context = { path = "crates/context" }
synth-contracts = { path = "crates/contracts" }
synth-evaluation = { path = "crates/evaluation" }
synth-governance = { path = "crates/governance" }
synth-infra = { path = "crates/infra" }
synth-model-gateway = { path = "crates/model-gateway" }
synth-runtime = { path = "crates/runtime" }
synth-schema-types = { path = "crates/schema-types" }
synth-sdr = { path = "crates/sdr" }
synth-testkit = { path = "crates/testkit" }
synth-tools = { path = "crates/tools" }

anyhow = "1.0"
# Object-safe async traits (ADR-0015).
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
# The Stream trait of the query loop only (ADR-0030). Already in the tree
# through rmcp and sqlx.
futures-core = { version = "0.3", default-features = false, features = ["std"] }
# Network schema resolution stays off: tests resolve references from local files only.
jsonschema = { version = "0.58", default-features = false }
prettyplease = "0.3"
# Property tests; the fork and timeout runners are not needed.
proptest = { version = "1.11", default-features = false, features = ["std"] }
regress = "0.12"
# HTTPS client of the model gateway (ADR-0027); the same 0.13 line rmcp uses.
# rustls with the ring provider, chosen in code: reqwest's default provider,
# aws-lc-rs, carries the OpenSSL license that deny.toml does not allow.
reqwest = { version = "0.13", default-features = false }
# MCP client for the tool gateway. Pinned exactly: 3.x changed its default
# protocol within minor releases, and 3.7.0 is the version checked against the
# build123d server (protocol 2026-07-28). No TLS feature: tool servers are
# reached over plain HTTP, on the compose network or its loopback forwarder.
rmcp = { version = "=3.7.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Verifies servers against the operating system's roots, plus an optional
# internal CA bundle. The range reqwest 0.13 accepts.
rustls-platform-verifier = "0.7"
# typify 0.8 reads schemars 0.8 schema types.
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# YAML for config/ (PR 6): pure-Rust parser, YAML 1.2, limits against alias
# bombs. Deserializes only.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
sha2 = "0.11"
# PostgreSQL access with compile-time checked queries (ADR-0016). Features are
# chosen per crate; no TLS backend until a shared environment exists.
sqlx = { version = "0.9", default-features = false }
syn = "3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# build.rs uses the library API only; the import_types! macro is not needed.
# Log output of the binaries: formatted to stderr, filtered by RUST_LOG.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
typify = { version = "0.8", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Allowed in tests through clippy.toml.
unwrap_used = "deny"
expect_used = "deny"

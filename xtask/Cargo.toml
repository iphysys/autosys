[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Config and benchmark validation only: without the postgres feature,
# building xtask needs no database.
synth-context.workspace = true
synth-contracts.workspace = true
# Benchmark problems as run requests: the evaluation crate's own (ADR-0034).
synth-evaluation.workspace = true
synth-infra = { workspace = true, default-features = false }
# Model routing checks beyond the schema: the gateway's own (ADR-0027).
synth-model-gateway.workspace = true
# Agent spec checks: the runtime's own agent registry (ADR-0030).
synth-runtime.workspace = true

anyhow.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

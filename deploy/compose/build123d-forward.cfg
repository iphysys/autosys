# HAProxy configuration of build123d-forward (deploy/compose/tools.yaml).
#
# A plain TCP relay with one listener and one fixed backend, so a harness
# process on the host can reach the build123d server, which has no route off
# its internal network. It does not route packets, proxy to other
# destinations, or rewrite requests; there is no stats page or admin socket.

global
    maxconn 64

defaults
    mode tcp
    timeout connect 5s
    # Above every tool timeout in config/tools/, so the gateway's own timeout
    # decides.
    timeout client 180s
    timeout server 180s

# Docker's embedded DNS, so a restarted build123d container is found again.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

frontend mcp
    bind :8000
    default_backend build123d

backend build123d
    server build123d build123d:8000 resolvers docker init-addr libc,none

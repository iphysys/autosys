# Tool servers (blueprint sections 3.2 and 17). From the repository root:
#
#   docker compose -f deploy/compose/tools.yaml up -d --wait build123d-forward
#   docker compose -f deploy/compose/tools.yaml --profile test run --rm build123d-test
#
# `cargo xtask test-tools` runs both and checks the isolation from outside.
#
# Tool servers are attached only to the `tools` network, which is internal:
# Docker gives it no route off the host, so nothing on it can reach the
# internet, and no server publishes a port. Containers run as a non-root user
# with a read-only root filesystem, no capabilities, and CPU, memory and
# process limits. Separate from compose.yaml so that running the tools does
# not need the database password.
#
# A harness process on the host (the worker, the gateway tests) reaches a
# server through its forwarder: a TCP relay on `tools` and on `host_access`
# that publishes one port on 127.0.0.1 only and relays it to the server's
# port. The server's own networks do not change.
name: autosys-tools

x-sandbox: &sandbox
  networks: [tools]
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 1g
        pids: 128

services:
  build123d:
    <<: *sandbox
    build:
      context: ../../mcp_servers/build123d
      target: runtime
    image: autosys/build123d:dev
    environment:
      BUILD123D_HOST: 0.0.0.0
      BUILD123D_PORT: "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -I
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 30s

  # The server's tests, lint and type check, on the same network and limits.
  build123d-test:
    <<: *sandbox
    profiles: [test]
    build:
      context: ../../mcp_servers/build123d
      target: test
    image: autosys/build123d:dev-test
    environment:
      BUILD123D_URL: http://build123d:8000/mcp
      BUILD123D_ISOLATION_TEST: "1"
    depends_on:
      build123d:
        condition: service_healthy

  # The host's way in to build123d: http://127.0.0.1:18123/mcp by default.
  # Fixed relay to build123d:8000 (build123d-forward.cfg); same sandbox as
  # the servers.
  build123d-forward:
    <<: *sandbox
    image: haproxy:3.2.25-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    networks: [tools, host_access]
    ports:
      - "127.0.0.1:${BUILD123D_HOST_PORT:-18123}:8000"
    volumes:
      - ./build123d-forward.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      build123d:
        condition: service_healthy

networks:
  tools:
    internal: true
  # Only the forwarders join it, to publish their loopback port.
  host_access: {}

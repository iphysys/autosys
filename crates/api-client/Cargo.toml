[package]
name = "synth-api-client"
version = "0.1.0"
description = "The typed client of the external HTTP API v0 and its resumable event stream, for the CLI and xtask (ADR-0034)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "api_client"

[dependencies]
synth-contracts.workspace = true

# Plain http to api-server on loopback in Increment 1, so no TLS feature
# (ADR-0034).
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true

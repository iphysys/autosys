[package]
name = "synth-api"
version = "0.1.0"
description = "The external HTTP API v0 and its resumable event stream, conforming to schemas/api/openapi.yaml (blueprint section 3.5, ADR-0018)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "api"

[dependencies]
synth-contracts.workspace = true

axum = { workspace = true, features = ["http1", "json", "tokio", "tracing"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["macros", "net", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
synth-testkit.workspace = true

http-body-util.workspace = true
serde-saphyr.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

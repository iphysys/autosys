[project]
name = "autosys-build123d"
version = "0.1.0"
description = "MCP server with typed build123d operations: create_plate and measure. No tool executes code."
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.13,<0.14",
    "jsonschema>=4.26,<5",
    "mcp>=2.3,<3",
    "starlette>=1.9,<2",
    "uvicorn>=0.54,<0.55",
]

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
    "types-jsonschema>=4.26,<5",
]
# Used by `cargo xtask codegen` only; the image never installs it.
codegen = [
    "datamodel-code-generator==0.86.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/build123d_server", "models/build123d_models"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "models", "tests"]
# Generated by `cargo xtask codegen`; never hand-edited or reformatted.
extend-exclude = ["models"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "S", "TID", "UP", "W"]

# Explicit, because the test image installs the models rather than copying them.
[tool.ruff.lint.isort]
known-first-party = ["build123d_models", "build123d_server", "conftest", "egress_probe"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Tools never start processes."
"runpy".msg = "Tools never run code."
"pickle".msg = "Tools never deserialize code."
"marshal".msg = "Tools never deserialize code."
"importlib.import_module".msg = "Tools never import code by name."
"importlib.util".msg = "Tools never import code by name."

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = ["tests"]
